description: POS multiplataforma para Inka Toys Luna - Flutter (Android/iOS/Windows/macOS/Web)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  path_provider: ^2.1.4
  pdf: ^3.11.0
  printing: ^5.13.4
  barcode: ^2.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/logo_color.png
    - assets/logo_grayscale.png
