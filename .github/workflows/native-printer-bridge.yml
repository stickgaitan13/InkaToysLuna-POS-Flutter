name: Native Printer Bridge

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/native_printer_bridge/**'
      - '.github/workflows/native-printer-bridge.yml'
  workflow_dispatch:

jobs:
  build-dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
      - name: Compile Java bridge
        shell: bash
        run: |
          set -euxo pipefail
          PLATFORM=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p tools/native_printer_bridge/build/classes tools/native_printer_bridge/build/dex
          javac -source 8 -target 8 -cp "$PLATFORM/android.jar" -d tools/native_printer_bridge/build/classes \
            tools/native_printer_bridge/src/com/inkatoys/MainActivity.java \
            tools/native_printer_bridge/src/com/inkatoys/InkaChromeClient.java
          "$BUILD_TOOLS/d8" --min-api 21 --lib "$PLATFORM/android.jar" \
            --output tools/native_printer_bridge/build/dex \
            tools/native_printer_bridge/build/classes/com/inkatoys/MainActivity.class \
            tools/native_printer_bridge/build/classes/com/inkatoys/InkaChromeClient.class
          test -s tools/native_printer_bridge/build/dex/classes.dex
          sha256sum tools/native_printer_bridge/build/dex/classes.dex
      - uses: actions/upload-artifact@v4
        with:
          name: inka-native-printer-classes-dex
          path: tools/native_printer_bridge/build/dex/classes.dex
