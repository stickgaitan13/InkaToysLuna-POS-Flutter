name: Native Printer Bridge Commit Output

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/native_printer_bridge/TRIGGER_COMMIT.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile native bridge with Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          PLATFORM=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          rm -rf tools/native_printer_bridge/build tools/native_printer_bridge/output/chunks_v862
          mkdir -p tools/native_printer_bridge/build/classes tools/native_printer_bridge/build/dex tools/native_printer_bridge/output/chunks_v862
          javac -source 8 -target 8 -cp "$PLATFORM/android.jar" -d tools/native_printer_bridge/build/classes \
            tools/native_printer_bridge/src/com/inkatoys/MainActivity.java \
            tools/native_printer_bridge/src/com/inkatoys/InkaChromeClient.java \
            tools/native_printer_bridge/src/com/inkatoys/StorageBridge.java \
            tools/native_printer_bridge/src/com/inkatoys/DeviceIdentityBridge.java
          find tools/native_printer_bridge/build/classes -name '*.class' -print0 | xargs -0 "$BUILD_TOOLS/d8" --min-api 21 --lib "$PLATFORM/android.jar" \
            --output tools/native_printer_bridge/build/dex
          test -s tools/native_printer_bridge/build/dex/classes.dex
          base64 -w0 tools/native_printer_bridge/build/dex/classes.dex > tools/native_printer_bridge/output/classes.dex.b64
          fold -w 1000 tools/native_printer_bridge/output/classes.dex.b64 > tools/native_printer_bridge/output/classes.dex.lines.txt
          sha256sum tools/native_printer_bridge/build/dex/classes.dex > tools/native_printer_bridge/output/classes.dex.sha256
          split -b 4000 -d -a 3 tools/native_printer_bridge/output/classes.dex.b64 tools/native_printer_bridge/output/chunks_v862/chunk_
          wc -c tools/native_printer_bridge/output/classes.dex.b64 > tools/native_printer_bridge/output/chunks_v862/LENGTH.txt
          sha256sum tools/native_printer_bridge/output/classes.dex.b64 > tools/native_printer_bridge/output/chunks_v862/BASE64_SHA256.txt
      - name: Commit compiled DEX output
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/native_printer_bridge/output/classes.dex.b64 tools/native_printer_bridge/output/classes.dex.lines.txt tools/native_printer_bridge/output/classes.dex.sha256 tools/native_printer_bridge/output/chunks_v862
          git diff --cached --quiet && exit 0
          git commit -m "Build hardened native storage + printer + device identity bridge DEX [skip ci]"
          git push
